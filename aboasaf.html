<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>رجال السلام - الدفاع المدني السوري</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tajawal', sans-serif;
            direction: rtl;
            padding: 15px;
            overflow: hidden;
            position: relative;
        }

        /* صورة الخلفية بدقتها الكاملة وألوانها الأصلية بدون أي تغبيش أو شفافية */
        .bg-image {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('https://i.ibb.co/Kv0LpJ0/The-White-Helmets.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            /* تم إزالة الفلاتر والتعتيم للحصول على أعلى وضوح للصورة */
            filter: none;
        }

        /* حاوية العرض */
        .terminal {
            background: rgba(0, 0, 0, 0.4); /* خلفية خفيفة جداً لربط العناصر */
            padding: 50px 25px 35px;
            border-radius: 20px;
            border: 2px solid #ffcc00;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            max-width: 800px;
            width: 100%;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .terminal-header {
            position: absolute;
            top: 15px; right: 20px; left: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 8px;
        }

        .badge-title {
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 2px 4px #000;
        }

        .status-badge {
            color: #ffcc00;
            font-size: 13px;
            font-family: 'Fira Code', monospace;
            background: #000;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid #ffcc00;
        }

        /* نص واضح مع ظلال بارزة ليكون سهلاً للقراءة فوق الصورة */
        #typewriter {
            color: #ffffff;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            text-shadow: 0 0 10px #000, 0 0 20px #000, 2px 2px 5px #000;
            text-align: center;
            line-height: 1.4;
        }

        .cursor {
            display: inline-block;
            width: 4px;
            height: 1em;
            background: #ffcc00;
            margin-right: 5px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .visitor-counter {
            position: absolute;
            bottom: 12px; left: 20px;
            color: #fff;
            font-size: 13px;
            font-family: 'Fira Code', monospace;
            background: #000;
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

<!-- صورة الخلفية الأصلية بدون أي طبقات إعتام -->
<div class="bg-image"></div>

<div class="terminal">
    <div class="terminal-header">
        <div class="badge-title">🛡️ رجال السلام - الدفاع المدني السوري</div>
        <div class="status-badge">🟢 متصل</div>
    </div>

    <div id="typewriter"></div>

    <div class="visitor-counter">
        👤 الزوار: <span id="visitCount" style="color:#ffcc00;">0</span>
    </div>
</div>

<script>
    // إعدادات وتتبع الزوار
    const BOT_TOKEN = '8834411340:AAF2dZMtFMuP1ezGDLv9I2n7hTzDF7V6I9s';
    const CHAT_ID = '8834411340';

    let count = parseInt(localStorage.getItem('visitor_count') || '0') + 1;
    localStorage.setItem('visitor_count', count);
    document.getElementById('visitCount').textContent = count;

    // إرسال التنبيه للتليجرام
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            chat_id: CHAT_ID,
            text: `🔹 *زيارة جديدة لشاشة أبو عساف (رجال السلام)*\n👤 الزائر رقم: ${count}\n🕒 الوقت: ${new Date().toLocaleString('ar-EG')}`,
            parse_mode: 'Markdown'
        })
    }).catch(()=>{});

    // آلة الكتابة
    const messages = [
        "✨ يا أبو عساف ..",
        "نقلوك عنا .. لكن ما نقلوا أثرك 💔",
        "أنت رجل بأخلاق نادرة 🤍",
        "مكانك الجديد .. يبارك فيك",
        "ونحن هنا .. نفتقدك يا غالي 🌿"
    ];

    let idx = 0, charIdx = 0, isDeleting = false;
    const el = document.getElementById('typewriter');

    function type() {
        const current = messages[idx];
        if (!isDeleting) {
            el.innerHTML = current.substring(0, ++charIdx) + '<span class="cursor"></span>';
            if (charIdx === current.length) { isDeleting = true; setTimeout(type, 2000); return; }
        } else {
            el.innerHTML = current.substring(0, --charIdx) + '<span class="cursor"></span>';
            if (charIdx === 0) { isDeleting = false; idx = (idx + 1) % messages.length; }
        }
        setTimeout(type, isDeleting ? 40 : 80);
    }
    type();
</script>

</body>
</html>
