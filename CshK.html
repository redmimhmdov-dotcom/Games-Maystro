<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#6C63FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="كشك">
    <link rel="manifest" href="/manifest.json">
    <title>🚭 كشك السجائر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f6f8fc 0%, #e9edf4 100%);
            color: #1a1a2e;
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 100px;
            min-height: 100vh;
        }

        /* رأس التطبيق - تصميم عصري */
        .app-header {
            background: linear-gradient(135deg, #6C63FF, #5A52D5);
            color: #fff;
            padding: 22px 24px;
            border-radius: 20px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(108, 99, 255, 0.35);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .app-title {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .app-title span {
            font-weight: 300;
            opacity: 0.85;
        }

        .app-title .icon-bg {
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 20px;
        }

        .clock-area {
            text-align: left;
            background: rgba(255, 255, 255, 0.12);
            padding: 8px 18px;
            border-radius: 14px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .clock-area .time {
            font-size: 26px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
            letter-spacing: 1px;
        }

        .clock-area .date {
            font-size: 13px;
            opacity: 0.85;
            font-weight: 300;
        }

        /* زر التثبيت */
        .install-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 8px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            backdrop-filter: blur(4px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: none;
            align-items: center;
            gap: 8px;
        }

        .install-btn.show {
            display: inline-flex !important;
        }

        .install-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
        }

        /* بطاقات الإحصائيات - تصميم زجاجي */
        .stats-card {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 16px 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108, 99, 255, 0.12);
        }

        .stat-item .number {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #6C63FF, #3F3D9E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-item .label {
            font-size: 13px;
            color: #5a5a7a;
            font-weight: 500;
            margin-top: 4px;
            display: block;
        }

        /* نموذج الإضافة */
        .form-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .form-row input {
            flex: 1;
            min-width: 120px;
            padding: 14px 18px;
            border: 2px solid rgba(108, 99, 255, 0.15);
            border-radius: 14px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            outline: none;
            color: #1a1a2e;
        }

        .form-row input:focus {
            border-color: #6C63FF;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.1);
            background: #fff;
        }

        .form-row input::placeholder {
            color: #9a9ab0;
            font-weight: 400;
        }

        /* أزرار - تصميم عصري */
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 50px;
            touch-action: manipulation;
            user-select: none;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6C63FF, #5A52D5);
            color: #fff;
            box-shadow: 0 4px 16px rgba(108, 99, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(108, 99, 255, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .btn-success {
            background: linear-gradient(135deg, #00C9A7, #00B894);
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 201, 167, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 201, 167, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #FF6B6B, #E74C6F);
            color: #fff;
            box-shadow: 0 4px 16px rgba(255, 107, 107, 0.3);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(255, 107, 107, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: #6C63FF;
            border: 2px solid #6C63FF;
        }

        .btn-outline:hover {
            background: rgba(108, 99, 255, 0.08);
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
            min-height: 38px;
            border-radius: 10px;
        }

        .btn-xs {
            padding: 4px 12px;
            font-size: 11px;
            min-height: 28px;
            border-radius: 8px;
            font-weight: 500;
        }

        /* قائمة العملاء */
        .client-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .client-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 18px 20px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .client-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(108, 99, 255, 0.08);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .client-name {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .client-name .avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #6C63FF, #3F3D9E);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
        }

        .client-amount {
            font-size: 20px;
            font-weight: 700;
            color: #FF6B6B;
            padding: 4px 14px;
            background: rgba(255, 107, 107, 0.08);
            border-radius: 12px;
        }

        .client-amount.paid {
            color: #00C9A7;
            background: rgba(0, 201, 167, 0.1);
            text-decoration: line-through;
            opacity: 0.7;
        }

        .client-meta {
            font-size: 13px;
            color: #6a6a8a;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .client-meta .badge {
            background: rgba(108, 99, 255, 0.08);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #6C63FF;
        }

        .client-meta .badge.paid-badge {
            background: rgba(0, 201, 167, 0.1);
            color: #00B894;
        }

        .client-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }

        .client-details {
            background: rgba(0, 0, 0, 0.02);
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 12px;
            font-size: 14px;
            color: #3a3a5a;
            display: none;
            border-right: 3px solid #6C63FF;
        }

        .client-details.open {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .client-details .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.04);
        }

        .client-details .detail-row:last-child {
            border-bottom: none;
        }

        /* Toast - رسائل منبثقة */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }

        .toast {
            background: rgba(26, 26, 46, 0.92);
            backdrop-filter: blur(16px);
            color: #fff;
            padding: 16px 28px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.25);
            animation: toastIn 0.5s cubic-bezier(0.4, 0, 0.2, 1), toastOut 0.5s ease 2.8s forwards;
            width: 100%;
            text-align: center;
            pointer-events: auto;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .toast.success {
            border-right: 4px solid #00C9A7;
        }

        .toast.warning {
            border-right: 4px solid #FFB900;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(-20px) scale(0.92);
            }
        }

        /* Modal - نافذة التعديل */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-box {
            background: #fff;
            border-radius: 24px;
            padding: 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px) scale(0.96);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .modal-box h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1a1a2e;
        }

        .modal-box input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(108, 99, 255, 0.15);
            border-radius: 14px;
            font-size: 16px;
            margin-bottom: 14px;
            outline: none;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.6);
        }

        .modal-box input:focus {
            border-color: #6C63FF;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.08);
            background: #fff;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .modal-actions .btn {
            flex: 1;
        }

        /* حالة فارغة */
        .empty-state {
            text-align: center;
            padding: 56px 20px;
            color: #8a8aaa;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state p {
            font-size: 16px;
            font-weight: 400;
        }

        /* استجابة */
        @media (max-width: 480px) {
            .header-row {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .clock-area {
                text-align: center;
            }
            .form-row input {
                min-width: 100%;
            }
            .btn {
                padding: 12px 18px;
                font-size: 15px;
                min-height: 44px;
            }
            .client-header {
                flex-direction: column;
                align-items: stretch;
            }
            .stats-card {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .stat-item .number {
                font-size: 22px;
            }
            .stat-item .label {
                font-size: 11px;
            }
        }

        /* شريط التمرير */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e9edf4;
        }
        ::-webkit-scrollbar-thumb {
            background: #c0c8d4;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a0aab8;
        }

        /* طباعة */
        @media print {
            .btn,
            .client-actions,
            .install-btn {
                display: none !important;
            }
            body {
                padding: 10px;
                background: #fff;
            }
            .app-header {
                background: #6C63FF !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .client-card {
                break-inside: avoid;
                border: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-row">
            <div class="app-title">
                <span class="icon-bg">🚭</span>
                كشك <span>السجائر</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <button class="install-btn show" id="installBtn" style="display:inline-flex!important;">📲 تثبيت</button>
                <div class="clock-area" id="clockDisplay">
                    <div class="time" id="timeDisplay">00:00:00</div>
                    <div class="date" id="dateDisplay">--/--/----</div>
                </div>
            </div>
        </div>
    </header>

    <!-- إحصائيات -->
    <div class="stats-card" id="statsCard">
        <div class="stat-item">
            <div class="number" id="totalDebts">0</div>
            <span class="label">إجمالي الديون</span>
        </div>
        <div class="stat-item">
            <div class="number" id="totalClients">0</div>
            <span class="label">عدد العملاء</span>
        </div>
        <div class="stat-item">
            <div class="number" id="totalPaid">0</div>
            <span class="label">تم سداده</span>
        </div>
    </div>

    <!-- نموذج الإضافة -->
    <div class="form-card">
        <div class="form-row">
            <input type="text" id="clientName" placeholder="👤 اسم العميل" autocomplete="off">
            <input type="number" id="clientAmount" placeholder="💰 المبلغ (ل.س)" step="0.01" min="0">
        </div>
        <button class="btn btn-primary" id="addBtn" style="width:100%;">
            ✚ إضافة عميل جديد
        </button>
    </div>

    <!-- قائمة العملاء -->
    <div id="clientListContainer"></div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Modal التعديل -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <h3>✏️ تعديل العميل</h3>
            <input type="text" id="editName" placeholder="اسم العميل">
            <input type="number" id="editAmount" placeholder="المبلغ" step="0.01" min="0">
            <div class="modal-actions">
                <button class="btn btn-outline" id="editCancelBtn">إلغاء</button>
                <button class="btn btn-primary" id="editSaveBtn">💾 حفظ</button>
            </div>
        </div>
    </div>

    <script>
        // ---------- البيانات ----------
        let clients = [];
        let editingIndex = -1;
        let deferredPrompt = null;

        // ---------- PWA: زر التثبيت ----------
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('installBtn');
            btn.classList.add('show');
            btn.style.display = 'inline-flex !important';
            console.log('✅ زر التثبيت جاهز');
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                if (result.outcome === 'accepted') {
                    showToast('✅ تم تثبيت التطبيق بنجاح!', 'success');
                } else {
                    showToast('❌ تم إلغاء التثبيت', 'warning');
                }
                deferredPrompt = null;
                document.getElementById('installBtn').classList.remove('show');
            } else {
                showToast('📲 استخدم "إضافة إلى الشاشة الرئيسية" من المتصفح', 'warning');
            }
        });

        // ---------- تحميل وحفظ ----------
        function loadData() {
            try {
                const saved = localStorage.getItem('cigarette_kiosk_data');
                if (saved) {
                    clients = JSON.parse(saved);
                } else {
                    clients = []; // ✅ بدون أسماء وهمية
                }
            } catch (e) { clients = []; }
        }

        function saveData() {
            localStorage.setItem('cigarette_kiosk_data', JSON.stringify(clients));
        }

        // ---------- الساعة ----------
        function updateClock() {
            const now = new Date();
            document.getElementById('timeDisplay').textContent = now.toLocaleTimeString('ar-SY', { hour: '2-digit',
                minute: '2-digit', second: '2-digit' });
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('ar-SY', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            });
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ---------- الإحصائيات ----------
        function updateStats() {
            const totalDebt = clients.reduce((sum, c) => sum + (c.amount - (c.paid || 0)), 0);
            const totalPaid = clients.reduce((sum, c) => sum + (c.paid || 0), 0);
            document.getElementById('totalDebts').textContent = totalDebt.toLocaleString();
            document.getElementById('totalClients').textContent = clients.length;
            document.getElementById('totalPaid').textContent = totalPaid.toLocaleString();
        }

        // ---------- الحصول على الحرف الأول للصورة الرمزية ----------
        function getAvatarLetter(name) {
            return name ? name.charAt(0).toUpperCase() : '?';
        }

        function getColorFromName(name) {
            const colors = ['#6C63FF', '#00C9A7', '#FF6B6B', '#FFB900', '#4ECDC4', '#FF6B9D', '#845EC2'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        // ---------- عرض العملاء ----------
        function renderClients() {
            const container = document.getElementById('clientListContainer');
            if (clients.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>لا يوجد عملاء بعد<br>أضف عميلاً جديداً من الأعلى</p>
                    </div>
                `;
                updateStats();
                return;
            }

            let html = '<div class="client-list">';
            clients.forEach((client, index) => {
                const remaining = client.amount - (client.paid || 0);
                const isPaid = remaining <= 0;
                const initial = getAvatarLetter(client.name);
                const color = getColorFromName(client.name);
                const historyHtml = client.history && client.history.length > 0 ?
                    client.history.map(h =>
                        `<div class="detail-row"><span>📅 ${h.date}</span><span>${h.amount.toLocaleString()} ل.س</span></div>`
                    ).join('') :
                    '<div class="detail-row"><span style="color:#8a8aaa;">لا يوجد سجلات</span></div>';

                html += `
                    <div class="client-card" data-index="${index}">
                        <div class="client-header">
                            <span class="client-name">
                                <span class="avatar" style="background:${color};">${initial}</span>
                                ${client.name}
                            </span>
                            <span class="client-amount ${isPaid ? 'paid' : ''}">
                                ${isPaid ? '✅ مدفوع' : remaining.toLocaleString() + ' ل.س'}
                            </span>
                        </div>
                        <div class="client-meta">
                            <span>💰 ${client.amount.toLocaleString()} ل.س</span>
                            <span>📌 مدفوع: ${(client.paid || 0).toLocaleString()} ل.س</span>
                            <span class="badge ${isPaid ? 'paid-badge' : ''}">${isPaid ? '✅ مكتمل' : '⏳ متبقي'}</span>
                            <button class="btn btn-xs btn-outline" onclick="toggleDetails(${index})">📋 التفاصيل</button>
                        </div>
                        <div class="client-details" id="details-${index}">
                            <div style="font-weight:600;margin-bottom:6px;color:#1a1a2e;">📜 سجل المدفوعات:</div>
                            ${historyHtml}
                            <div class="detail-row" style="font-weight:600;border-top:2px solid rgba(0,0,0,0.06);margin-top:6px;padding-top:6px;color:#1a1a2e;">
                                <span>المتبقي</span>
                                <span>${remaining > 0 ? remaining.toLocaleString() + ' ل.س' : '✅ صفر'}</span>
                            </div>
                        </div>
                        <div class="client-actions">
                            <button class="btn btn-sm btn-success" onclick="payDebt(${index})">💰 سداد</button>
                            <button class="btn btn-sm btn-outline" onclick="openEditModal(${index})">✏️ تعديل</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteClient(${index})">🗑️ حذف</button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
            updateStats();
        }

        // ---------- التفاصيل ----------
        function toggleDetails(index) {
            const el = document.getElementById(`details-${index}`);
            if (el) el.classList.toggle('open');
        }

        // ---------- إضافة عميل ----------
        function addClient() {
            const nameInput = document.getElementById('clientName');
            const amountInput = document.getElementById('clientAmount');
            const name = nameInput.value.trim();
            const amount = parseFloat(amountInput.value);

            if (!name) { showToast('⚠️ الرجاء إدخال اسم العميل', 'warning'); return; }
            if (!amount || amount <= 0) { showToast('⚠️ الرجاء إدخال مبلغ صحيح', 'warning'); return; }

            clients.push({
                id: Date.now(),
                name: name,
                amount: amount,
                paid: 0,
                history: []
            });

            saveData();
            renderClients();
            nameInput.value = '';
            amountInput.value = '';
            showToast(`✅ تم إضافة ${name} بمبلغ ${amount.toLocaleString()} ل.س`, 'success');
            nameInput.focus();
        }

        // ---------- سداد دين ----------
        function payDebt(index) {
            const client = clients[index];
            const remaining = client.amount - (client.paid || 0);

            if (remaining <= 0) {
                showToast(`✅ ${client.name} مدفوع بالكامل بالفعل`, 'success');
                return;
            }

            const choice = confirm(
                `🔔 ${client.name}\nالمتبقي: ${remaining.toLocaleString()} ل.س\n\nاضغط "موافق" لتسديد كامل المبلغ\nاضغط "إلغاء" لإدخال مبلغ جزئي`
            );

            if (choice) {
                const paidAmount = remaining;
                client.paid = (client.paid || 0) + paidAmount;
                client.history.push({
                    date: new Date().toLocaleDateString('ar-SY'),
                    amount: paidAmount
                });
                saveData();
                renderClients();
                showToast(`✅ تم سداد كامل مبلغ ${client.name} (${paidAmount.toLocaleString()} ل.س)`, 'success');
            } else {
                const partial = prompt(
                    `💰 أدخل المبلغ الذي تريد سداده من ${client.name}:\n(المتبقي: ${remaining.toLocaleString()} ل.س)`
                );
                if (partial !== null) {
                    const val = parseFloat(partial);
                    if (!val || val <= 0) {
                        showToast('⚠️ المبلغ غير صحيح', 'warning');
                        return;
                    }
                    if (val > remaining) {
                        showToast(`⚠️ المبلغ أكبر من المتبقي (${remaining.toLocaleString()})`, 'warning');
                        return;
                    }
                    client.paid = (client.paid || 0) + val;
                    client.history.push({
                        date: new Date().toLocaleDateString('ar-SY'),
                        amount: val
                    });
                    saveData();
                    renderClients();
                    const newRemaining = client.amount - client.paid;
                    if (newRemaining <= 0) {
                        showToast(`✅ ${client.name} مكتمل السداد!`, 'success');
                    } else {
                        showToast(`✅ تم سداد ${val.toLocaleString()} ل.س، المتبقي ${newRemaining.toLocaleString()}`,
                            'success');
                    }
                }
            }
        }

        // ---------- حذف عميل ----------
        function deleteClient(index) {
            const name = clients[index].name;
            if (confirm(`🗑️ هل أنت متأكد من حذف "${name}"؟`)) {
                clients.splice(index, 1);
                saveData();
                renderClients();
                showToast(`🗑️ تم حذف ${name}`, 'warning');
            }
        }

        // ---------- تعديل ----------
        function openEditModal(index) {
            editingIndex = index;
            const client = clients[index];
            document.getElementById('editName').value = client.name;
            document.getElementById('editAmount').value = client.amount;
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingIndex = -1;
        }

        function saveEdit() {
            if (editingIndex === -1) return;
            const name = document.getElementById('editName').value.trim();
            const amount = parseFloat(document.getElementById('editAmount').value);
            if (!name) { showToast('⚠️ الاسم مطلوب', 'warning'); return; }
            if (!amount || amount <= 0) { showToast('⚠️ مبلغ صحيح مطلوب', 'warning'); return; }

            const client = clients[editingIndex];
            client.name = name;
            client.amount = amount;
            if (client.paid > amount) client.paid = amount;

            saveData();
            renderClients();
            closeEditModal();
            showToast(`✅ تم تعديل ${name}`, 'success');
        }

        // ---------- Toast ----------
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 3000);
        }

        // ---------- أحداث ----------
        document.getElementById('addBtn').addEventListener('click', addClient);
        document.getElementById('clientName').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('clientAmount').focus();
        });
        document.getElementById('clientAmount').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addClient();
        });
        document.getElementById('editCancelBtn').addEventListener('click', closeEditModal);
        document.getElementById('editSaveBtn').addEventListener('click', saveEdit);
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeEditModal();
        });

        // منع الإغلاق عند الرجوع
        window.addEventListener('load', () => {
            window.history.pushState(null, null, window.location.href);
            window.addEventListener('popstate', () => {
                window.history.pushState(null, null, window.location.href);
            });
        });

        // حفظ تلقائي
        window.addEventListener('beforeunload', saveData);
        setInterval(saveData, 5000);

        // ---------- تشغيل ----------
        loadData();
        renderClients();

        // ---------- ظهور زر التثبيت تلقائياً ----------
        setTimeout(() => {
            const btn = document.getElementById('installBtn');
            if (btn) {
                btn.style.display = 'inline-flex !important';
                btn.classList.add('show');
                console.log('✅ زر التثبيت ظهر تلقائياً');
            }
        }, 500);

        // ---------- مراقبة التثبيت ----------
        window.addEventListener('appinstalled', () => {
            showToast('✅ تم تثبيت التطبيق بنجاح!', 'success');
            document.getElementById('installBtn').classList.remove('show');
        });

        // ---------- تسجيل Service Worker ----------
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('✅ Service Worker مسجل بنجاح'))
                .catch(err => console.log('❌ خطأ في تسجيل Service Worker:', err));
        }

        console.log('🚭 كشك السجائر - جاهز!');
        console.log('🚀 PWA جاهز للتثبيت - اضغط على زر "تثبيت"');
    </script>
</body>
</html>
