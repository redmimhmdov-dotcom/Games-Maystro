<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>النظام المالي المتقدم - وزارة الدفاع</title>
    <style>
        /* ====== جميع الأنماط السابقة تبقى كما هي ====== */
        /* ... (ضع هنا جميع الأنماط السابقة) ... */

        /* ====== إشعار بطاقة دعوة ====== */
        .invitation-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(145deg, #1a2a2a, #0a1a1a);
            border: 1px solid #c9a84c;
            border-radius: 20px;
            padding: 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(201,168,76,0.2);
            z-index: 9999;
            max-width: 380px;
            width: 100%;
            transform: translateY(120px) scale(0.8);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }
        .invitation-toast.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        .invitation-toast .header {
            background: linear-gradient(135deg, #c9a84c, #a08030);
            padding: 16px 20px 12px;
            text-align: center;
            position: relative;
        }
        .invitation-toast .header .icon {
            font-size: 32px;
            margin-bottom: 4px;
            display: block;
        }
        .invitation-toast .header .title {
            color: #0a1a1a;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.2);
        }
        .invitation-toast .header .subtitle {
            color: #1a2a2a;
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
        }
        .invitation-toast .body {
            padding: 18px 20px 20px;
            text-align: center;
        }
        .invitation-toast .body .message {
            color: #c9d4c9;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 8px;
        }
        .invitation-toast .body .message .highlight {
            color: #c9a84c;
            font-weight: bold;
        }
        .invitation-toast .body .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c9a84c, transparent);
            margin: 10px auto;
        }
        .invitation-toast .body .details {
            color: #8a9a8a;
            font-size: 12px;
            line-height: 1.6;
        }
        .invitation-toast .footer {
            padding: 10px 20px 16px;
            text-align: center;
            border-top: 1px solid rgba(201,168,76,0.15);
        }
        .invitation-toast .footer .btn-close-toast {
            background: transparent;
            border: 1px solid #c9a84c;
            color: #c9a84c;
            padding: 6px 24px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .invitation-toast .footer .btn-close-toast:hover {
            background: #c9a84c;
            color: #0a1a1a;
        }
        .invitation-toast .decoration {
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 60px;
            opacity: 0.05;
            transform: rotate(15deg);
            pointer-events: none;
        }
        .invitation-toast.success .header { background: linear-gradient(135deg, #2a6a2a, #1a4a1a); }
        .invitation-toast.success { border-color: #4a8a4a; }
        .invitation-toast.error .header { background: linear-gradient(135deg, #6a2a2a, #4a1a1a); }
        .invitation-toast.error { border-color: #8a4a4a; }
        .invitation-toast.info .header { background: linear-gradient(135deg, #2a4a6a, #1a2a4a); }
        .invitation-toast.info { border-color: #4a6a8a; }

        @media (max-width: 480px) {
            .invitation-toast {
                right: 10px;
                left: 10px;
                max-width: none;
                bottom: 10px;
            }
            .invitation-toast .header .title { font-size: 16px; }
            .invitation-toast .body .message { font-size: 14px; }
        }
    </style>
</head>
<body>
    <!-- ====== جميع عناصر الصفحة السابقة تبقى كما هي ====== -->
    <!-- ... -->

    <!-- ====== إشعار بطاقة دعوة ====== -->
    <div id="invitationToast" class="invitation-toast">
        <div class="decoration">✨</div>
        <div class="header">
            <span class="icon" id="toastIcon">🎉</span>
            <div class="title" id="toastTitle">تهانينا!</div>
            <div class="subtitle" id="toastSubtitle">تمت العملية بنجاح</div>
        </div>
        <div class="body">
            <div class="message" id="toastMessage">تم <span class="highlight">إضافة</span> المصروف بنجاح</div>
            <div class="divider"></div>
            <div class="details" id="toastDetails">🕐 الآن | 📋 تم التسجيل في السجل</div>
        </div>
        <div class="footer">
            <button class="btn-close-toast" onclick="closeInvitationToast()">✔️ حسناً</button>
        </div>
    </div>

    <script>
        // =====================================================
        // Toast Notification (بطاقة دعوة)
        // =====================================================
        let toastTimeout = null;

        function showInvitationToast(message, type = 'success', details = '') {
            const toast = document.getElementById('invitationToast');
            const icon = document.getElementById('toastIcon');
            const title = document.getElementById('toastTitle');
            const subtitle = document.getElementById('toastSubtitle');
            const msg = document.getElementById('toastMessage');
            const detailsEl = document.getElementById('toastDetails');

            // إعدادات حسب النوع
            const config = {
                success: {
                    icon: '🎉',
                    title: 'تم بنجاح!',
                    subtitle: 'عملية مالية مكتملة'
                },
                error: {
                    icon: '⚠️',
                    title: 'تنبيه!',
                    subtitle: 'حدث خطأ'
                },
                info: {
                    icon: '📋',
                    title: 'معلومة',
                    subtitle: 'تحديث النظام'
                }
            };

            const cfg = config[type] || config.success;
            icon.textContent = cfg.icon;
            title.textContent = cfg.title;
            subtitle.textContent = cfg.subtitle;

            // تنسيق الرسالة مع تمييز الكلمات المهمة
            let formattedMessage = message;
            // إضافة تمييز للكلمات المفتاحية
            const keywords = ['إضافة', 'تحديث', 'حذف', 'استلام', 'مصروف', 'فاتورة', 'تم', 'نجاح'];
            keywords.forEach(word => {
                const regex = new RegExp(word, 'g');
                formattedMessage = formattedMessage.replace(regex, `<span class="highlight">${word}</span>`);
            });
            msg.innerHTML = formattedMessage;

            // التفاصيل الإضافية
            if (details) {
                detailsEl.textContent = details;
            } else {
                const now = new Date().toLocaleString('ar-EG');
                detailsEl.textContent = `🕐 ${now} | 📋 تم التسجيل في السجل`;
            }

            // إزالة الكلاسات السابقة
            toast.className = 'invitation-toast ' + type;

            // إظهار البطاقة
            clearTimeout(toastTimeout);
            // إعادة تشغيل الأنيميشن
            void toast.offsetWidth;
            toast.classList.add('show');

            // إخفاء تلقائي بعد 5 ثواني
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 5000);
        }

        function closeInvitationToast() {
            const toast = document.getElementById('invitationToast');
            toast.classList.remove('show');
            clearTimeout(toastTimeout);
        }

        // =====================================================
        // استبدال دالة showToast القديمة
        // =====================================================
        function showToast(message, type = 'success', details = '') {
            showInvitationToast(message, type, details);
        }

        // =====================================================
        // باقي الكود (نفس السابق)
        // =====================================================
        // ... (ضع هنا جميع دوال النظام السابقة)
        // =====================================================
    </script>
</body>
</html>
