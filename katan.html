<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Katanbuild | المتجر الذكي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Cairo:wght@300;600;800&display=swap" rel="stylesheet"/>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Cairo', sans-serif; background: #0b0a09; color: #ece6dc; }

        /* ===== شاشة الترحيب ===== */
        #splash {
            position: fixed; inset:0; z-index:9999;
            background: #0b0a09;
            display: flex; align-items: center; justify-content: center;
            animation: fadeOut 2.5s ease forwards;
            animation-delay: 1s;
        }
        @keyframes fadeOut {
            0% { opacity:1; }
            80% { opacity:1; visibility:visible; }
            100% { opacity:0; visibility:hidden; }
        }
        .splash-content {
            text-align: center;
            animation: pulseGlow 2s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 15px #b58a5b44); }
            50% { filter: drop-shadow(0 0 40px #b58a5bcc); }
        }
        .splash-content img {
            width: 220px;
            border-radius: 20px;
            margin-bottom: 15px;
        }
        .splash-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 42px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 25px #b58a5b88;
        }
        .splash-sub {
            color: #b58a5b;
            font-size: 16px;
            letter-spacing: 4px;
            display: block;
            margin-top: 6px;
        }
        .splash-typewriter {
            margin-top: 20px;
            font-size: 18px;
            color: #b58a5b;
            min-height: 30px;
            direction: ltr;
        }
        #splashWriter::after, #typewriter::after {
            content: "|";
            animation: blink 0.7s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

        /* ===== الهيدر والشريط ===== */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 30px; background: #1a1714dd; backdrop-filter:blur(10px);
            border-bottom: 1px solid #b58a5b44; position:sticky; top:0; z-index:100;
        }
        .logo { display:flex; align-items:center; gap:10px; cursor:pointer; flex-wrap:wrap; }
        .logo-text { font-family:'Orbitron',sans-serif; font-weight:700; font-size:22px; color:#fff; }
        .logo-sub { font-size:10px; color:#b58a5b; letter-spacing:2px; display:block; width:100%; margin-top:-4px; }
        
        .header-left { display:flex; align-items:center; gap:15px; flex-wrap:wrap; }
        .datetime { font-family:'Orbitron',sans-serif; font-size:13px; color:#b58a5b; background:#00000055; padding:6px 12px; border-radius:30px; border:1px solid #b58a5b33; }
        .btn-contact, .btn-order {
            background:transparent; border:1.5px solid #b58a5b; color:#b58a5b;
            padding:8px 20px; border-radius:30px; font-weight:700; cursor:pointer;
            transition:0.2s; font-family:'Cairo',sans-serif;
        }
        .btn-contact:hover, .btn-order:hover { background:#b58a5b; color:#0b0a09; }

        .notification-bar {
            background:#1a1714; padding:10px 20px; text-align:center;
            border-bottom:1px solid #b58a5b33; min-height:48px;
            font-size:16px; color:#ece6dc;
        }

        /* ===== قسم المنتجات والتصنيفات ===== */
        .products { padding:40px 20px; max-width:1400px; margin:auto; }
        .products h2 { font-size:30px; font-weight:800; margin-bottom:25px; border-right:5px solid #b58a5b; padding-right:15px; }

        .filter-buttons {
            display:flex; gap:10px; flex-wrap:wrap; margin-bottom:30px;
        }
        .filter-btn {
            background:#1a1714; border:1px solid #b58a5b55; color:#b58a5b;
            padding:8px 22px; border-radius:30px; font-weight:700; cursor:pointer;
            transition:0.2s; font-family:'Cairo',sans-serif; font-size:15px;
        }
        .filter-btn.active, .filter-btn:hover {
            background:#b58a5b; color:#0b0a09; border-color:#b58a5b;
            box-shadow: 0 4px 15px #b58a5b44;
        }

        .product-grid {
            display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
            gap:25px;
        }
        .product-card {
            background:#1a1714; border-radius:16px; overflow:hidden;
            border:1px solid #b58a5b33; transition:0.25s; cursor:pointer;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .product-card:hover { transform:translateY(-5px); border-color:#b58a5b; box-shadow:0 10px 25px #00000088; }
        
        .img-container {
            width:100%; height:190px; background:#0b0a09; position:relative; overflow:hidden;
        }
        .product-card img { 
            width:100%; height:100%; object-fit:cover; display:block;
            transition: opacity 0.3s ease; opacity: 0;
        }
        .product-card img.loaded { opacity: 1; }

        .product-card .info { padding:15px; flex-grow: 1; display:flex; flex-direction:column; justify-content:space-between; }
        .product-card h3 { font-size:17px; margin-bottom:6px; color:#fff; }
        .product-card p { color:#b58a5b; font-size:13px; margin-bottom:12px; }
        .product-card .btn-detail {
            background:#b58a5b22; border:1px solid #b58a5b66; color:#b58a5b;
            padding:6px 16px; border-radius:20px; font-weight:700; cursor:pointer;
            transition:0.2s; font-family:'Cairo',sans-serif; width: 100%;
        }
        .product-card .btn-detail:hover { background:#b58a5b; color:#0b0a09; }

        .img-placeholder {
            position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
            background: #151311; color: #b58a5b66; font-size:13px; text-align:center; padding:10px;
        }

        footer {
            background:#1a1714; padding:25px 40px;
            display:flex; justify-content:space-between; align-items:center;
            border-top:1px solid #b58a5b33; color:#b58a5b88; margin-top:50px;
        }

        /* ===== النوافذ المنبثقة والوحة التحكم ===== */
        .modal, .admin-panel {
            position:fixed; inset:0; z-index:999;
            background:#000000cc; backdrop-filter:blur(5px);
            display:none; align-items:center; justify-content:center;
        }
        .modal-content, .admin-content {
            background:#1a1714; padding:30px; border-radius:20px;
            max-width:650px; width:92%; max-height:85vh; overflow-y:auto;
            border:1px solid #b58a5b55; position:relative;
        }
        .close {
            position:absolute; top:12px; left:20px; font-size:28px;
            color:#b58a5b; cursor:pointer;
        }
        .admin-content label { display:block; margin:10px 0 4px; color:#b58a5b; font-weight:600; }
        .admin-content input, .admin-content select, .admin-content button, .modal input, .modal select {
            width:100%; padding:10px 14px; margin:5px 0 12px; border-radius:10px;
            background:#0b0a09; border:1px solid #b58a5b55; color:#fff;
            font-family:'Cairo',sans-serif;
        }
        .admin-content button, .modal button {
            background:#b58a5b; color:#0b0a09; font-weight:800; border:none; cursor:pointer; margin-top:5px;
        }

        .admin-product-item {
            display:flex; align-items:center; gap:12px;
            background:#0b0a09; padding:10px; border-radius:10px;
            margin:8px 0; border:1px solid #b58a5b33;
        }
        .admin-product-item img { width:45px; height:45px; object-fit:cover; border-radius:6px; background:#1a1714; }
        .admin-product-item .info { flex:1; }
        .admin-product-item .info h4 { color:#fff; font-size:14px; }
        .admin-product-item .info p { color:#b58a5b; font-size:11px; }
        .admin-product-item .actions button {
            background:transparent; border:1px solid #b58a5b55; color:#b58a5b;
            padding:4px 10px; border-radius:6px; cursor:pointer; margin:0 2px; width:auto; display:inline-block;
        }
        .admin-product-item .actions .delete { border-color:#ff4444; color:#ff4444; }

        #lightbox {
            position:fixed; inset:0; z-index:9999; background:#000000f0;
            display:flex; align-items:center; justify-content:center; cursor:pointer;
        }
        #lightbox img { max-width:90%; max-height:85vh; border-radius:12px; border:1px solid #b58a5b; }

        @media (max-width:700px) {
            header { flex-direction:column; padding:12px; gap:10px; }
            .products { padding:20px 12px; }
            .splash-text { font-size:30px; }
        }
    </style>
</head>

            { id: 36, name: 'عازل بلاستيكي', desc: 'عازل بلاستيكي عالي الجودة', category: 'عوازل', img: 'https://i.ibb.co/qhxdYSC/عازل-بلاستيكي.jpg' },
            { id: 37, name: 'عازل حجر شفاف', desc: 'عازل حجر شفاف ممتاز', category: 'عوازل', img: 'https://i.ibb.co/zV0GwTQy/عازل-حجر-شفاف.jpg' },
            { id: 38, name: 'عازل مركبين', desc: 'عازل مركبين فاخر', category: 'عوازل', img: 'https://i.ibb.co/7dSKY11t/عازل-مركبين.jpg' }
        ];

        let products = [];
        let whatsappNumber = '0952725590';
        let typewriterMsg = 'مرحباً بكم في Katanbuild – مواد بناء متطورة بأعلى معايير الجودة.';

        function initData() {
            const stored = localStorage.getItem('kb_products_v2');
            products = stored ? JSON.parse(stored) : DEFAULT_PRODUCTS;
            
            const savedNum = localStorage.getItem('kb_wa');
            if(savedNum) whatsappNumber = savedNum;
            
            const savedMsg = localStorage.getItem('kb_msg');
            if(savedMsg) typewriterMsg = savedMsg;
            
            document.getElementById('whatsappNumber').value = whatsappNumber;
            document.getElementById('typewriterMsg').value = typewriterMsg;
        }

        function saveData() {
            localStorage.setItem('kb_products_v2', JSON.stringify(products));
            localStorage.setItem('kb_wa', whatsappNumber);
            localStorage.setItem('kb_msg', typewriterMsg);
        }

        // تشغيل الواجهة
        document.addEventListener("DOMContentLoaded", () => {
            initData();

            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main').style.display = 'block';
                updateClock();
                setInterval(updateClock, 1000);
                renderCategoryButtons();
                renderProducts('الكل');
                populateProductSelect();
                startTypewriter();
            }, 2000);
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('datetime').textContent = now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
        }

        // عرض أزرار الأقسام والفرعيات
        function renderCategoryButtons() {
            const container = document.getElementById('filterButtons');
            container.innerHTML = CATEGORIES.map(cat => `
                <button class="filter-btn ${cat === 'الكل' ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat}</button>
            `).join('');
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(cat);
        }

        // عرض المنتجات وتسريع تحميل الصور
        function renderProducts(category) {
            const grid = document.getElementById('productGrid');
            const list = category === 'الكل' ? products : products.filter(p => p.category === category);

            if(list.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#b58a5b; padding:40px;">لا توجد مواد متاحة في هذا القسم حالياً.</p>`;
                return;
            }

            grid.innerHTML = list.map(p => `
                <div class="product-card" onclick="openLightbox('${p.img}')">
                    <div class="img-container">
                        <div class="img-placeholder">⏳ جاري التحميل...</div>
                        <img 
                            src="${p.img}" 
                            alt="${p.name}" 
                            loading="lazy" 
                            onload="this.classList.add('loaded'); this.previousElementSibling.style.display='none';" 
                            onerror="this.previousElementSibling.innerHTML='📷 صورة غير متاحة';"
                        />
                    </div>
                    <div class="info">
                        <div>
                            <h3>${p.name}</h3>
                            <p>${p.desc}</p>
                        </div>
                        <button class="btn-detail" onclick="event.stopPropagation(); quickOrder('${p.name}')">طلب المادة</button>
                    </div>
                </div>
            `).join('');
        }

        function populateProductSelect() {
            const select = document.getElementById('productSelect');
            select.innerHTML = '<option value="">اختر المنتج المطلوب</option>' + 
                products.map(p => `<option value="${p.name}">${p.name} (${p.category})</option>`).join('');
        }

        // آلة كاتبة
        function startTypewriter() {
            const el = document.getElementById('typewriter');
            let i = 0;
            el.textContent = '';
            function type() {
                if (i < typewriterMsg.length) {
                    el.textContent += typewriterMsg.charAt(i);
                    i++;
                    setTimeout(type, 50);
                } else {
                    setTimeout(() => { i = 0; el.textContent = ''; type(); }, 3000);
                }
            }
            type();
        }

        // التحكم بالنوافذ
        function openWhatsApp() { window.open(`https://wa.me/${whatsappNumber}`, '_blank'); }
        function openOrder() { document.getElementById('orderModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function quickOrder(pName) {
            openOrder();
            document.getElementById('productSelect').value = pName;
        }

        function openLightbox(src) {
            const box = document.createElement('div');
            box.id = 'lightbox';
            box.innerHTML = `<img src="${src}" /><span class="close" style="top:20px; left:30px;">&times;</span>`;
            box.onclick = () => box.remove();
            document.body.appendChild(box);
        }

        // دخول لوحة التحكم (5 ضغطات على اللوجو)
        let logoClicks = 0;
        document.getElementById('mainLogo').addEventListener('click', () => {
            logoClicks++;
            if(logoClicks >= 5) {
                logoClicks = 0;
                const pass = prompt('🔐 كلمة المرور للوحة التحكم:');
                if(pass === 'katan2026') {
                    document.getElementById('adminPanel').style.display = 'flex';
                    renderAdminList();
                } else {
                    alert('كلمة المرور غير صحيحة.');
                }
            }
        });

        function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }

        // إداريات
        function renderAdminList() {
            const container = document.getElementById('adminProductList');
            container.innerHTML = products.map(p => `
                <div class="admin-product-item">
                    <img src="${p.img}" />
                    <div class="info">
                        <h4>${p.name}</h4>
                        <p>${p.category} - ${p.desc}</p>
                    </div>
                    <div class="actions">
                        <button onclick="editProduct(${p.id})">✏️ تعديل</button>
                        <button class="delete" onclick="deleteProduct(${p.id})">🗑️ حذف</button>
                    </div>
                </div>
            `).join('');
        }

        function addProduct() {
            const name = document.getElementById('newName').value.trim();
            const desc = document.getElementById('newDesc').value.trim();
            const category = document.getElementById('newCategory').value;
            const img = document.getElementById('newImg').value.trim();

            if(!name || !desc || !category || !img) return alert('يرجى ملء جميع الحقول');

            products.unshift({ id: Date.now(), name, desc, category, img });
            saveData();
            renderProducts('الكل');
            populateProductSelect();
            renderAdminList();
            document.getElementById('adminForm').reset();
            alert('✅ تم إضافة المادة بنجاح');
        }

        function editProduct(id) {
            const p = products.find(item => item.id === id);
            if(!p) return;

            const nName = prompt('اسم المادة:', p.name);
            const nDesc = prompt('الوصف:', p.desc);
            const nImg = prompt('رابط الصورة:', p.img);

            if(nName) p.name = nName;
            if(nDesc) p.desc = nDesc;
            if(nImg) p.img = nImg;

            saveData();
            renderProducts('الكل');
            populateProductSelect();
            renderAdminList();
        }

        function deleteProduct(id) {
            if(confirm('هل انت متأكد من الحذف؟')) {
                products = products.filter(p => p.id !== id);
                saveData();
                renderProducts('الكل');
                populateProductSelect();
                renderAdminList();
            }
        }

        function updateWhatsApp() {
            whatsappNumber = document.getElementById('whatsappNumber').value.trim();
            saveData();
            alert('✅ تم تحديث رقم الواتساب');
        }

        function updateTypewriter() {
            typewriterMsg = document.getElementById('typewriterMsg').value.trim();
            saveData();
            startTypewriter();
            alert('✅ تم تحديث نص الشريط المتحرك');
        }
    </script>
</body>
</html>
