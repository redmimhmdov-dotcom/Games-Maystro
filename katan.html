<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Katanbuild | المتجر الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Cairo:wght@300;600;800&display=swap" rel="stylesheet"/>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Cairo', sans-serif; background: #0b0a09; color: #ece6dc; }

        /* ===== شاشة الترحيب ===== */
        #splash {
            position: fixed; inset:0; z-index:9999;
            background: #0b0a09;
            display: flex; align-items: center; justify-content: center;
            animation: fadeOut 3.5s ease forwards;
        }
        @keyframes fadeOut {
            0% { opacity:1; }
            70% { opacity:1; }
            100% { opacity:0; visibility:hidden; }
        }
        .splash-content {
            text-align: center;
            animation: pulseGlow 2s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 20px #b58a5b44); }
            50% { filter: drop-shadow(0 0 60px #b58a5bcc) drop-shadow(0 0 120px #b58a5b66); }
        }
        .splash-content img {
            width: 280px;
            border-radius: 24px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .splash-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 52px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 3px;
            text-shadow: 0 0 30px #b58a5b88;
        }
        .splash-sub {
            color: #b58a5b;
            font-size: 18px;
            letter-spacing: 6px;
            display: block;
            margin-top: 8px;
        }
        .splash-typewriter {
            margin-top: 30px;
            font-size: 22px;
            color: #b58a5b;
            min-height: 40px;
            direction: ltr;
        }
        #splashWriter::after {
            content: "|";
            animation: blink 0.7s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

        /* ===== باقي الأنماط ===== */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 40px; background: #1a1714dd; backdrop-filter:blur(8px);
            border-bottom: 1px solid #b58a5b44; position:sticky; top:0; z-index:100;
        }
        .logo { display:flex; align-items:center; gap:10px; cursor:pointer; flex-wrap:wrap; }
        .logo-text { font-family:'Orbitron',sans-serif; font-weight:700; font-size:22px; color:#fff; }
        .logo-sub { font-size:10px; color:#b58a5b; letter-spacing:2px; display:block; width:100%; margin-top:-4px; }
        .flag-logo {
            animation: flagWave 3s ease-in-out infinite;
            transform-origin: center left;
        }
        @keyframes flagWave {
            0%,100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-2deg) scale(1.02); }
            75% { transform: rotate(2deg) scale(1.02); }
        }
        .header-left { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
        .datetime { font-family:'Orbitron',sans-serif; font-size:14px; color:#b58a5b; background:#00000055; padding:6px 14px; border-radius:40px; border:1px solid #b58a5b33; }
        .btn-contact, .btn-order {
            background:transparent; border:1.5px solid #b58a5b; color:#b58a5b;
            padding:8px 22px; border-radius:40px; font-weight:700; cursor:pointer;
            transition:0.2s; font-family:'Cairo',sans-serif;
        }
        .btn-contact:hover, .btn-order:hover { background:#b58a5b; color:#0b0a09; }

        .notification-bar {
            background:#1a1714; padding:12px 20px; text-align:center;
            border-bottom:1px solid #b58a5b33; min-height:54px;
            font-size:18px; color:#ece6dc;
        }
        #typewriter::after { content: "|"; animation: blink 0.7s infinite; }

        .products { padding:50px 40px; max-width:1400px; margin:auto; }
        .products h2 { font-size:36px; font-weight:800; margin-bottom:30px; border-right:6px solid #b58a5b; padding-right:20px; }

        .filter-buttons {
            display:flex; gap:14px; flex-wrap:wrap; margin-bottom:40px;
        }
        .filter-btn {
            background:transparent; border:2px solid #b58a5b55; color:#b58a5b;
            padding:8px 30px; border-radius:40px; font-weight:700; cursor:pointer;
            transition:0.2s; font-family:'Cairo',sans-serif;
        }
        .filter-btn.active, .filter-btn:hover {
            background:#b58a5b; color:#0b0a09; border-color:#b58a5b;
        }

        .product-grid {
            display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
            gap:30px;
        }
        .product-card {
            background:#1a1714; border-radius:16px; overflow:hidden;
            border:1px solid #b58a5b33; transition:0.25s; cursor:pointer;
        }
        .product-card:hover { transform:translateY(-6px); border-color:#b58a5b; box-shadow:0 12px 30px #00000077; }
        .product-card img { width:100%; height:200px; object-fit:cover; display:block; }
        .product-card .info { padding:18px; }
        .product-card h3 { font-size:18px; margin-bottom:4px; color:#fff; }
        .product-card p { color:#b58a5b; font-size:14px; margin-bottom:10px; }
        .product-card .btn-detail {
            background:#b58a5b33; border:none; color:#b58a5b;
            padding:6px 20px; border-radius:40px; font-weight:700; cursor:pointer;
            transition:0.2s; font-family:'Cairo',sans-serif;
        }
        .product-card .btn-detail:hover { background:#b58a5b; color:#0b0a09; }

        footer {
            background:#1a1714; padding:30px 40px;
            display:flex; justify-content:space-between; align-items:center;
            border-top:1px solid #b58a5b33; color:#b58a5b88;
        }
        .social a { color:#b58a5b88; margin:0 12px; text-decoration:none; font-weight:700; }
        .social a:hover { color:#b58a5b; }

        .modal, .admin-panel {
            position:fixed; inset:0; z-index:999;
            background:#000000cc; backdrop-filter:blur(4px);
            display:none; align-items:center; justify-content:center;
        }
        .modal-content, .admin-content {
            background:#1a1714; padding:40px; border-radius:24px;
            max-width:700px; width:90%; max-height:80vh; overflow-y:auto;
            border:1px solid #b58a5b55; position:relative;
        }
        .close {
            position:absolute; top:12px; left:20px; font-size:32px;
            color:#b58a5b; cursor:pointer;
        }
        .admin-content label { display:block; margin:12px 0 4px; color:#b58a5b; font-weight:600; }
        .admin-content input, .admin-content select, .admin-content button, .modal input, .modal select, .modal textarea {
            width:100%; padding:12px; margin:6px 0; border-radius:12px;
            background:#0b0a09; border:1px solid #b58a5b55; color:#fff;
            font-family:'Cairo',sans-serif;
        }
        .admin-content button, .modal button {
            background:#b58a5b; color:#0b0a09; font-weight:800; border:none; cursor:pointer;
        }
        .admin-content button:hover, .modal button:hover { opacity:0.8; }
        hr { border-color:#b58a5b33; margin:20px 0; }

        #lightbox {
            position:fixed; inset:0; z-index:9999;
            background:#000000ee; backdrop-filter:blur(8px);
            display:flex; align-items:center; justify-content:center;
            cursor:pointer;
        }
        #lightbox img { max-width:90%; max-height:90%; border-radius:16px; box-shadow:0 0 60px #b58a5b66; }
        #lightbox span { position:absolute; top:20px; left:30px; font-size:48px; color:#b58a5b; font-weight:300; cursor:pointer; }

        .admin-product-item {
            display:flex; align-items:center; gap:12px;
            background:#0b0a09; padding:10px; border-radius:12px;
            margin:8px 0; border:1px solid #b58a5b33; cursor:pointer;
            transition:0.2s;
        }
        .admin-product-item:hover { border-color:#b58a5b; background:#1a1714; }
        .admin-product-item img { width:50px; height:50px; object-fit:cover; border-radius:8px; }
        .admin-product-item .info { flex:1; }
        .admin-product-item .info h4 { color:#fff; font-size:14px; }
        .admin-product-item .info p { color:#b58a5b; font-size:12px; }
        .admin-product-item .actions button {
            background:transparent; border:1px solid #b58a5b55; color:#b58a5b;
            padding:4px 12px; border-radius:8px; cursor:pointer; margin:0 4px;
        }
        .admin-product-item .actions button:hover { background:#b58a5b; color:#0b0a09; }
        .admin-product-item .actions .delete { border-color:#ff4444; color:#ff4444; }
        .admin-product-item .actions .delete:hover { background:#ff4444; color:#fff; }

        @media (max-width:700px) {
            header { flex-direction:column; padding:12px; gap:12px; }
            .header-left { width:100%; justify-content:center; flex-wrap:wrap; }
            .products { padding:30px 16px; }
            .splash-text { font-size:32px; }
            .splash-content img { width: 180px; }
        }
        @media (max-width:480px) {
            .product-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>

    <!-- ===== شاشة الترحيب ===== -->
    <div id="splash">
        <div class="splash-content">
            <img src="https://i.ibb.co/ynfj9gdt/Gemini-Generated-Image-jpxoekjpxoekjpxo.png" alt="Katanbuild" />
            <span class="splash-text">Katanbuild</span>
            <span class="splash-sub">INNOVATIVE BUILDING PRODUCTS</span>
            <div class="splash-typewriter">
                <span id="splashWriter"></span>
            </div>
        </div>
    </div>

    <!-- ===== الصفحة الرئيسية ===== -->
    <div id="main" style="display:none;">

        <header>
            <div class="logo flag-logo" id="mainLogo">
                <img src="https://i.ibb.co/ynfj9gdt/Gemini-Generated-Image-jpxoekjpxoekjpxo.png" alt="Katanbuild" height="50" style="border-radius:8px; margin-left:10px;" />
                <span class="logo-text">Katanbuild</span>
                <span class="logo-sub">INNOVATIVE BUILDING PRODUCTS</span>
            </div>
            <div class="header-left">
                <div class="datetime" id="datetime">--:-- --</div>
                <button class="btn-contact" onclick="openWhatsApp()">📞 تواصل معنا</button>
                <button class="btn-order" onclick="openOrder()">🛒 طلب منتج</button>
            </div>
        </header>

        <div class="notification-bar">
            <span id="typewriter"></span>
        </div>

        <section class="products">
            <h2>منتجاتنا</h2>
            <div class="filter-buttons" id="filterButtons">
                <!-- سيتم توليد أزرار التصنيفات تلقائياً -->
            </div>
            <div class="product-grid" id="productGrid"></div>
        </section>

        <footer>
            <p>© 2026 Katanbuild – جميع الحقوق محفوظة</p>
            <div class="social">
                <a href="#">FB</a>
                <a href="#">IG</a>
                <a href="#">YT</a>
            </div>
        </footer>
    </div>

    <!-- ===== نافذة طلب منتج ===== -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('orderModal')">&times;</span>
            <h2>🛒 طلب منتج</h2>
            <form onsubmit="event.preventDefault(); alert('✅ تم إرسال الطلب'); this.reset();">
                <select id="productSelect" required><option value="">اختر المنتج</option></select>
                <input type="number" placeholder="الكمية" min="1" required />
                <input type="text" placeholder="اسمك" required />
                <input type="text" placeholder="رقم الهاتف" required />
                <button type="submit">إرسال الطلب</button>
            </form>
        </div>
    </div>

    <!-- ===== لوحة التحكم (CMS) ===== -->
    <div id="adminPanel" class="admin-panel" style="display:none;">
        <div class="admin-content">
            <span class="close" onclick="closeAdmin()">&times;</span>
            <h2>🔐 لوحة التحكم - إدارة المنتجات</h2>

            <!-- نموذج الإضافة -->
            <form id="adminForm" onsubmit="event.preventDefault(); addProduct();">
                <h3 style="color:#b58a5b; margin:10px 0;">➕ إضافة منتج جديد</h3>
                <input type="text" id="newImg" placeholder="رابط الصورة (مباشر)" required />
                <input type="text" id="newName" placeholder="اسم المنتج (مثل: كاروفيكس)" required />
                <input type="text" id="newDesc" placeholder="وصف مختصر" required />
                <select id="newCategory" required>
                    <option value="">-- اختر التصنيف الرئيسي --</option>
                    <option value="لاصق ديكور">لاصق ديكور</option>
                    <option value="لاصق مسابح">لاصق مسابح</option>
                    <option value="لاصق غرانيت">لاصق غرانيت</option>
                    <option value="لاصق سيراميك">لاصق سيراميك</option>
                    <option value="لاصق خارجي">لاصق خارجي</option>
                    <option value="طينة">طينة</option>
                    <option value="روبة">روبة</option>
                </select>
                <button type="submit">➕ إضافة منتج</button>
            </form>

            <hr />

            <!-- قائمة المنتجات مع إدارة -->
            <h3 style="color:#b58a5b; margin:10px 0;">📋 قائمة المنتجات (اضغط على المنتج لتعديل الصورة)</h3>
            <div id="adminProductList"></div>

            <hr />

            <!-- إعدادات إضافية -->
            <label>📞 تحديث رقم واتساب</label>
            <input type="text" id="whatsappNumber" placeholder="0952725590" />
            <button onclick="updateWhatsApp()">تحديث الرقم</button>

            <label>✏️ تحديث رسالة الآلة الكاتبة</label>
            <input type="text" id="typewriterMsg" placeholder="أدخل الرسالة..." />
            <button onclick="updateTypewriter()">تحديث الرسالة</button>
        </div>
    </div>

    <script>
        // ===== البيانات والتخزين =====
        let products = [];
        let whatsappNumber = '0952725590';
        let typewriterMsg = 'مرحباً بكم في Katanbuild – حلول بناء مبتكرة ذات جودة ألمانية.';
        let splashMsg = 'جودة ألمانية في كل منتج';

        // ===== تحميل البيانات من LocalStorage =====
        function loadData() {
            const stored = localStorage.getItem('katanbuild_products');
            if (stored) {
                products = JSON.parse(stored);
            } else {
                // البيانات الافتراضية بالمسميات الجديدة
                products = [
                    { id: 1, name: 'كاروفيكس', desc: 'لاصق ديكور عالي الجودة', category: 'لاصق ديكور', img: 'https://i.ibb.co/Mk0y0k2h/1.png' },
                    { id: 2, name: 'مادة عازلة', desc: 'لاصق مسابح مقاوم للماء', category: 'لاصق مسابح', img: 'https://i.ibb.co/Mk0y0k2h/1.png' },
                    { id: 3, name: 'غرانيت برو', desc: 'لاصق غرانيت فاخر', category: 'لاصق غرانيت', img: 'https://i.ibb.co/Mk0y0k2h/1.png' },
                    { id: 4, name: 'سيراميك بلس', desc: 'لاصق سيراميك ممتاز', category: 'لاصق سيراميك', img: 'https://i.ibb.co/Mk0y0k2h/1.png' },
                    { id: 5, name: 'خارجي إكس', desc: 'لاصق خارجي متين', category: 'لاصق خارجي', img: 'https://i.ibb.co/Mk0y0k2h/1.png' },
                    { id: 6, name: 'طينة ناعمة', desc: 'طينة عالية النقاء', category: 'طينة', img: 'https://i.ibb.co/Mk0y0k2h/1.png' },
                    { id: 7, name: 'روبوت كلين', desc: 'روبة متطورة للتنظيف', category: 'روبة', img: 'https://i.ibb.co/Mk0y0k2h/1.png' }
                ];
                saveData();
            }

            const savedWhatsApp = localStorage.getItem('katanbuild_whatsapp');
            if (savedWhatsApp) whatsappNumber = savedWhatsApp;
            
            const savedMsg = localStorage.getItem('katanbuild_typewriter');
            if (savedMsg) typewriterMsg = savedMsg;
            
            const savedSplash = localStorage.getItem('katanbuild_splashmsg');
            if (savedSplash) splashMsg = savedSplash;
        }

        function saveData() {
            localStorage.setItem('katanbuild_products', JSON.stringify(products));
            localStorage.setItem('katanbuild_whatsapp', whatsappNumber);
            localStorage.setItem('katanbuild_typewriter', typewriterMsg);
            localStorage.setItem('katanbuild_splashmsg', splashMsg);
        }

        // ===== عناصر DOM =====
        const grid = document.getElementById('productGrid');
        const splash = document.getElementById('splash');
        const main = document.getElementById('main');
        const datetimeEl = document.getElementById('datetime');
        const typewriterEl = document.getElementById('typewriter');
        const splashWriterEl = document.getElementById('splashWriter');
        const productSelect = document.getElementById('productSelect');
        const filterContainer = document.getElementById('filterButtons');
        const adminList = document.getElementById('adminProductList');

        // ===== تهيئة الصفحة =====
        loadData();

        setTimeout(() => {
            splash.style.display = 'none';
            main.style.display = 'block';
            updateClock();
            setInterval(updateClock, 1000);
            renderFilters();
            renderProducts('all');
            populateSelect();
            renderAdminList();
            startTypewriter();
            startSplashTypewriter();
        }, 3500);

        // ===== الساعة =====
        function updateClock() {
            const now = new Date();
            const d = now.toLocaleDateString('ar-EG', { weekday:'short', year:'numeric', month:'short', day:'numeric' });
            const t = now.toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
            datetimeEl.textContent = `${d} | ${t}`;
        }

        // ===== عرض أزرار التصنيفات =====
        function renderFilters() {
            const categories = [...new Set(products.map(p => p.category))];
            let html = `<button class="filter-btn active" data-filter="all">الكل</button>`;
            categories.forEach(cat => {
                html += `<button class="filter-btn" data-filter="${cat}">${cat}</button>`;
            });
            filterContainer.innerHTML = html;

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderProducts(this.dataset.filter);
                });
            });
        }

        // ===== عرض المنتجات =====
        function renderProducts(category = 'all') {
            const filtered = category === 'all' ? products : products.filter(p => p.category === category);
            grid.innerHTML = filtered.map(p => `
                <div class="product-card" onclick="openLightbox('${p.img}')">
                    <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300/1a1714/b58a5b?text=Katanbuild'"/>
                    <div class="info">
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                        <button class="btn-detail" onclick="event.stopPropagation(); alert('تفاصيل: ${p.name}')">تفاصيل</button>
                    </div>
                </div>
            `).join('');
        }

        function populateSelect() {
            productSelect.innerHTML = '<option value="">اختر المنتج</option>' +
                products.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
        }

        // ===== Lightbox =====
        function openLightbox(imgSrc) {
            const existing = document.getElementById('lightbox');
            if (existing) existing.remove();
            const lightbox = document.createElement('div');
            lightbox.id = 'lightbox';
            lightbox.innerHTML = `<img src="${imgSrc}" alt="منتج" /><span onclick="this.parentElement.remove()">&times;</span>`;
            lightbox.onclick = function(e) { if (e.target === this) this.remove(); };
            document.body.appendChild(lightbox);
        }

        // ===== الآلة الكاتبة =====
        function startTypewriter() {
            let i = 0;
            typewriterEl.textContent = '';
            function type() {
                if (i < typewriterMsg.length) {
                    typewriterEl.textContent += typewriterMsg.charAt(i);
                    i++;
                    setTimeout(type, 60);
                } else {
                    setTimeout(() => { i=0; typewriterEl.textContent=''; type(); }, 4000);
                }
            }
            type();
        }

        function startSplashTypewriter() {
            let i = 0;
            splashWriterEl.textContent = '';
            function type() {
                if (i < splashMsg.length) {
                    splashWriterEl.textContent += splashMsg.charAt(i);
                    i++;
                    setTimeout(type, 80);
                }
            }
            type();
        }

        // ===== واتساب =====
        function openWhatsApp() {
            const num = whatsappNumber.replace(/\D/g, '');
            window.open(`https://wa.me/${num}`, '_blank');
        }

        // ===== النوافذ المنبثقة =====
        function openOrder() { document.getElementById('orderModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        window.onclick = function(e) {
            if (e.target.classList.contains('modal')) e.target.style.display = 'none';
        };

        // ===== لوحة التحكم =====
        let clickCount = 0;
        document.getElementById('mainLogo').addEventListener('click', function() {
            clickCount++;
            if (clickCount === 5) {
                const pwd = prompt('🔐 أدخل كلمة المرور:');
                if (pwd === 'katan2026') {
                    document.getElementById('adminPanel').style.display = 'flex';
                    renderAdminList();
                } else {
                    alert('كلمة مرور خاطئة.');
                }
                clickCount = 0;
            }
        });

        function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }

        // ===== إدارة المنتجات في لوحة التحكم =====
        function renderAdminList() {
            adminList.innerHTML = products.map(p => `
                <div class="admin-product-item" onclick="editProductImage(${p.id})">
                    <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/50/1a1714/b58a5b?text=?'" />
                    <div class="info">
                        <h4>${p.name}</h4>
                        <p>${p.desc} | ${p.category}</p>
                    </div>
                    <div class="actions" onclick="event.stopPropagation();">
                        <button onclick="editProduct(${p.id})">✏️ تعديل</button>
                        <button class="delete" onclick="deleteProduct(${p.id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        // دالة جديدة لتعديل الصورة فقط عند الضغط على المنتج
        function editProductImage(id) {
            const p = products.find(pr => pr.id === id);
            if (!p) return;
            const newImg = prompt('📷 أدخل رابط الصورة الجديد:', p.img);
            if (newImg !== null && newImg.trim() !== '') {
                p.img = newImg.trim();
                saveData();
                renderProducts(document.querySelector('.filter-btn.active')?.dataset?.filter || 'all');
                renderAdminList();
                alert('✅ تم تحديث الصورة');
            }
        }

        function addProduct() {
            const img = document.getElementById('newImg').value.trim();
            const name = document.getElementById('newName').value.trim();
            const desc = document.getElementById('newDesc').value.trim();
            const category = document.getElementById('newCategory').value;
            if (!img || !name || !desc || !category) { alert('يرجى ملء جميع الحقول'); return; }
            products.push({ id: Date.now(), name, desc, category, img });
            saveData();
            renderFilters();
            renderProducts(document.querySelector('.filter-btn.active')?.dataset?.filter || 'all');
            populateSelect();
            renderAdminList();
            alert('✅ تم إضافة المنتج');
            document.querySelectorAll('#adminForm input').forEach(el => el.value='');
        }

        function deleteProduct(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
            products = products.filter(p => p.id !== id);
            saveData();
            renderFilters();
            renderProducts(document.querySelector('.filter-btn.active')?.dataset?.filter || 'all');
            populateSelect();
            renderAdminList();
            alert('✅ تم حذف المنتج');
        }

        function editProduct(id) {
            const p = products.find(pr => pr.id === id);
            if (!p) return;
            const newName = prompt('✏️ الاسم الجديد:', p.name);
            if (newName !== null && newName.trim() !== '') p.name = newName.trim();
            const newDesc = prompt('✏️ الوصف الجديد:', p.desc);
            if (newDesc !== null && newDesc.trim() !== '') p.desc = newDesc.trim();
            const newCat = prompt('✏️ التصنيف الجديد (لاصق ديكور، لاصق مسابح، الخ):', p.category);
            if (newCat !== null && newCat.trim() !== '') p.category = newCat.trim();
            saveData();
            renderFilters();
            renderProducts(document.querySelector('.filter-btn.active')?.dataset?.filter || 'all');
            populateSelect();
            renderAdminList();
            alert('✅ تم تحديث المنتج');
        }

        function updateWhatsApp() {
            const val = document.getElementById('whatsappNumber').value.trim();
            if (val) { 
                whatsappNumber = val; 
                saveData(); 
                alert('✅ تم تحديث رقم واتساب'); 
            }
        }

        function updateTypewriter() {
            const val = document.getElementById('typewriterMsg').value.trim();
            if (val) { 
                typewriterMsg = val; 
                saveData(); 
                startTypewriter(); 
                alert('✅ تم تحديث الرسالة'); 
            }
        }

        // ===== إغلاق النوافذ بالضغط على ESC =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal, .admin-panel, #lightbox').forEach(el => {
                    if (el) el.style.display = 'none';
                });
            }
        });
    </script>
</body>
</html>
